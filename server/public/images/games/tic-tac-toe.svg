<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="Tic-Tac-Toe">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <text x="60" y="90" fill="#e5e7eb" font-family="Arial, sans-serif" font-size="56" font-weight="700">Tic-Tac-Toe</text>
  <g transform="translate(420,150)">
    <rect width="360" height="360" rx="20" fill="#0f172a" stroke="#4b5563" stroke-width="6"/>
    <line x1="120" y1="20" x2="120" y2="340" stroke="#9ca3af" stroke-width="8"/>
    <line x1="240" y1="20" x2="240" y2="340" stroke="#9ca3af" stroke-width="8"/>
    <line x1="20" y1="120" x2="340" y2="120" stroke="#9ca3af" stroke-width="8"/>
    <line x1="20" y1="240" x2="340" y2="240" stroke="#9ca3af" stroke-width="8"/>

    <line x1="45" y1="45" x2="95" y2="95" stroke="#60a5fa" stroke-width="12" stroke-linecap="round"/>
    <line x1="95" y1="45" x2="45" y2="95" stroke="#60a5fa" stroke-width="12" stroke-linecap="round"/>

    <circle cx="180" cy="70" r="28" fill="none" stroke="#f87171" stroke-width="10"/>

    <line x1="285" y1="45" x2="335" y2="95" stroke="#60a5fa" stroke-width="12" stroke-linecap="round"/>
    <line x1="335" y1="45" x2="285" y2="95" stroke="#60a5fa" stroke-width="12" stroke-linecap="round"/>

    <circle cx="65" cy="185" r="28" fill="none" stroke="#f87171" stroke-width="10"/>

    <line x1="165" y1="165" x2="195" y2="205" stroke="#60a5fa" stroke-width="12" stroke-linecap="round"/>
    <line x1="195" y1="165" x2="165" y2="205" stroke="#60a5fa" stroke-width="12" stroke-linecap="round"/>

    <circle cx="300" cy="185" r="28" fill="none" stroke="#f87171" stroke-width="10"/>

    <line x1="45" y1="285" x2="95" y2="335" stroke="#60a5fa" stroke-width="12" stroke-linecap="round"/>
    <line x1="95" y1="285" x2="45" y2="335" stroke="#60a5fa" stroke-width="12" stroke-linecap="round"/>

    <circle cx="180" cy="300" r="28" fill="none" stroke="#f87171" stroke-width="10"/>

    <line x1="285" y1="285" x2="335" y2="335" stroke="#60a5fa" stroke-width="12" stroke-linecap="round"/>
    <line x1="335" y1="285" x2="285" y2="335" stroke="#60a5fa" stroke-width="12" stroke-linecap="round"/>
  </g>
  <text x="60" y="640" fill="#9ca3af" font-family="Arial, sans-serif" font-size="30">Classic 3x3 battle</text>
</svg>
