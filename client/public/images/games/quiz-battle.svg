<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="Quiz Battle">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <text x="60" y="90" fill="#e0e7ff" font-family="Arial, sans-serif" font-size="56" font-weight="700">Quiz Battle</text>

  <g transform="translate(260,150)">
    <rect width="680" height="380" rx="22" fill="#4338ca" stroke="#818cf8" stroke-width="6"/>
    <text x="40" y="70" fill="#eef2ff" font-size="34" font-family="Arial, sans-serif" font-weight="700">Which game uses a 3x3 board?</text>

    <rect x="40" y="110" width="280" height="70" rx="12" fill="#6366f1"/>
    <text x="65" y="155" fill="#eef2ff" font-size="28" font-family="Arial, sans-serif">A) Snake</text>

    <rect x="360" y="110" width="280" height="70" rx="12" fill="#22c55e"/>
    <text x="385" y="155" fill="#052e16" font-size="28" font-family="Arial, sans-serif" font-weight="700">B) Tic-Tac-Toe ✓</text>

    <rect x="40" y="205" width="280" height="70" rx="12" fill="#6366f1"/>
    <text x="65" y="250" fill="#eef2ff" font-size="28" font-family="Arial, sans-serif">C) Chess</text>

    <rect x="360" y="205" width="280" height="70" rx="12" fill="#6366f1"/>
    <text x="385" y="250" fill="#eef2ff" font-size="28" font-family="Arial, sans-serif">D) Quiz Battle</text>

    <g transform="translate(40,305)">
      <rect width="600" height="30" rx="10" fill="#312e81"/>
      <rect width="420" height="30" rx="10" fill="#f59e0b"/>
      <text x="250" y="22" fill="#111827" text-anchor="middle" font-size="20" font-family="Arial, sans-serif" font-weight="700">Round Time</text>
    </g>
  </g>

  <text x="60" y="640" fill="#c7d2fe" font-family="Arial, sans-serif" font-size="30">Fast questions. Real-time competition.</text>
</svg>
